services:
  postgres:
    image: postgres:16-alpine
    container_name: convenience_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PostgresSecret123!}
      POSTGRES_DB: ${POSTGRES_DB:-convenience_store_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-convenience_store_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - convenience_network

  redis:
    image: redis:7-alpine
    container_name: convenience_store_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-RedisSecret123!}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisSecret123!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - convenience_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: convenience_store_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@conveniencestore.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-AdminSecret123!}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - convenience_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  convenience_network:
    driver: bridge
